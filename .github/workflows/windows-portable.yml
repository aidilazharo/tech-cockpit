name: ATGV Windows dependency bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '**/package.json'
      - '**/package-lock.json'
      - 'vendor/windows-x64/bundle-policy.json'
      - 'scripts/build-atgv-windows-dependencies.mjs'
      - '.github/workflows/windows-portable.yml'
permissions:
  contents: write
concurrency:
  group: atgv-windows-dependencies-main
  cancel-in-progress: true
jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: x64
      - name: Build Windows dependency archives
        shell: pwsh
        run: node scripts/build-atgv-windows-dependencies.mjs
      - name: Commit verified archives to main for git pull
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/windows-x64
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'git diff failed' }
          git commit -m "build: refresh ATGV Windows x64 npm dependencies"
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Main changed or push blocked; rebuild on latest main.' }
